name: Database maintenance
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    if: ${{ vars.ENABLE_DATABASE_MAINTENANCE == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --omit=dev
      - run: npm run cleanup --prefix backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: 'true'
